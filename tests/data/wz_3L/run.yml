set automatic_html_opening False --no_save
set notification_center False --no_save
set zerowidth_tchannel False --no_save
set nb_core 40 --no_save
set nb_core_pythia8 40 --no_save
set nb_core_delphes 40 --no_save
import model sm
define p = g u c d s b u~ c~ d~ s~ b~
define j = g u c d s b u~ c~ d~ s~ b~
define l+ = e+ mu+ ta+
define l- = e- mu- ta-
define vl = ve vm vt
define vl~ = ve~ vm~ vt~
generate p p > w+ z QCD=0 QED=2, w+ > l+ vl, z > l+ l-
add process p p > w- z QCD=0 QED=2, w- > l- vl~, z > l+ l-
output wz_3L --f
launch wz_3L
shower = Pythia8
detector = Delphes
analysis = OFF
madspin = OFF
reweight = OFF
done
set ebeam 6800
../Cards/pythia8_card_TuneA14.dat
../Cards/delphes_card_ATLAS_FatJetPTMin50.tcl
set pdlabel lhapdf
set lhaid 331900
set use_syst False
set nevents 5_000
done