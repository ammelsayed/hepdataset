[build-system]
requires = ["setuptools>=64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hepdataset"
version = "5.0.0"
description = "Software for making ML-ready datasets from Delphes ROOT files for HEP studies"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "A.M.M. Elsayed", email = "ammelsayed@mail.ustc.edu.cn" },
    { name = "Yusheng Wu", email = "wuyusheng@ustc.edu.cn" }
]
maintainers = [
    { name = "A.M.M. Elsayed", email = "ahmedphysica@outlook.com" }
]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
keywords = [
    "HEP",
    "high-energy-physics",
    "Delphes",
    "ROOT",
    "machine-learning",
    "dataset",
    "particle-physics",
]
dependencies = [
    "numpy",
    "pandas",
    "tabulate",
    "PyYAML",
    "tqdm",
    "numba",
    "mt2",
    "uproot",
    "importlib-resources; python_version < '3.9'",
]

[project.urls]
Homepage = "https://github.com/ammelsayed/hepdataset"
Repository = "https://github.com/ammelsayed/hepdataset.git"
Issues = "https://github.com/ammelsayed/hepdataset/issues"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "ruff",
]

[project.scripts]
hepdataset = "hepdataset.cli:main"

[tool.setuptools]
packages = [
    "hepdataset",
    "hepdataset.core",
    "hepdataset.loops",
    "hepdataset.utils",
[tool.setuptools]
packages = [
    "hepdataset",
    "hepdataset.core",
    "hepdataset.loops",
    "hepdataset.utils",
]

[tool.setuptools.package-dir]
hepdataset = "src"
"hepdataset.core" = "src/core"
"hepdataset.loops" = "src/loops"
"hepdataset.utils" = "src/utils"

[tool.setuptools.package-data]
hepdataset = [
    "defaults/*.yml",
]

[tool.setuptools.exclude-package-data]
"*" = ["*.pyc", "*.so", "*.dll", "*.dylib", "__pycache__"]
