#
# use:
#   nL  :  total number of leptons (no requirment on lepton flavour)
#   ne  :  Number of electrons
#   nmu :  Number of muons
#   QL  :  absolute total charge of the leptons
#   nj  :  Number of jets
#   nbj :  Number of b-jets
#   ncj :  Number of b-jets
#   ntj :  Number of tau-jets
#   nJ  :  Number of Fatjets

Channels:
# ===============================================================
  0L:
    Regions:
      J:
        requirement: nJ == 1
      JJ:
        requirement: nJ == 2
      JJJ:
        requirement: nJ >= 3
# ===============================================================
  1L:
    Regions:
      e:
        requirement: (ne == 1) & (nmu == 0) & (nJ == 0)
      mu:
        requirement: (ne == 0) & (nmu == 1) & (nJ == 0)
      lep:
        requirement: (nL == 1) & (nJ == 0)
# ----------------------------------------------------------------
      eJ:
        requirement: (ne == 1) & (nmu == 0) & (nJ == 1)
      muJ:
        requirement: (ne == 0) & (nmu == 1) & (nJ == 1)
      lepJ:
        requirement: (nL == 1) & (nJ == 1)
# ----------------------------------------------------------------
      eJJ:
        requirement: (ne == 1) & (nmu == 0) & (nJ >= 2)
      muJJ:
        requirement: (ne == 0) & (nmu == 1) & (nJ >= 2)
      lepJJ:
        requirement: (nL == 1) & (nJ >= 2)
# ===============================================================
  2OSL:
    Regions:
      ee:
        requirement: (ne == 2) & (nmu == 0) & (QL == 0) & (nJ == 0)
      emu:
        requirement: (ne == 1) & (nmu == 1) & (QL == 0) & (nJ == 0)
      mumu:
        requirement: (ne == 0) & (nmu == 2) & (QL == 0) & (nJ == 0)
      leplep:
        requirement: (nL == 2) & (QL == 0) & (nJ == 0)
# ----------------------------------------------------------------
      leplepJ:
        requirement: (nL == 2) & (QL == 0) & (nJ >= 1)
# ===============================================================
  2SSL:
    Regions:
      ee:
        requirement: (ne == 2) & (nmu == 0) & (QL == 2) & (nJ == 0)
      emu:
        requirement: (ne == 1) & (nmu == 1) & (QL == 2) & (nJ == 0)
      mumu:
        requirement: (ne == 0) & (nmu == 2) & (QL == 2) & (nJ == 0)
      leplep:
        requirement: (nL == 2) & (QL == 2) & (nJ == 0)
# ----------------------------------------------------------------
      leplepJ:
        requirement: (nL == 2) & (QL == 2) & (nJ >= 1)
# ===============================================================
  3L:
    Regions:
      eee:
        requirement: (ne == 3) & (nmu == 0)
      eemu:
        requirement: (ne == 2) & (nmu == 1)
      emumu:
        requirement: (ne == 1) & (nmu == 2)
      mumumu:
        requirement: (ne == 0) & (nmu == 3)
      lepleplep:
        requirement: (nL == 3)
# ===============================================================